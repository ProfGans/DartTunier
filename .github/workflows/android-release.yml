name: App Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APPDATA: /tmp/dart-tournament-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify SQLite assets for tests and Android
        run: python3 tool/prepare_sqlite_ci.py x64.linux arm.android arm64.android x64.android
      - name: Validate release version
        shell: python
        run: |
          import os, pathlib, re
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+\+[1-9]\d*)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)[1]
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pubspec.yaml including build number'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_TAG=v' + version + '\n')
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/tournament_simulation_matrix_test.dart test/android_release_test.dart test/backup_service_test.dart
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: python
        run: |
          import base64, os, pathlib
          for key in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']:
              if not os.environ.get(key):
                  raise SystemExit('Missing Android signing secret: ' + key)
          keyfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': str(keyfile), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          pathlib.Path('android/key.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()))
      - name: Configure Android push (optional)
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_BASE64 }}
        shell: python
        run: |
          import os, base64, pathlib, json
          value = os.environ.get('FIREBASE_ANDROID_CONFIG')
          if value:
              raw = base64.b64decode(value, validate=True)
              config = json.loads(raw)
              assert config['project_info']['project_id'] == 'darttunier-6f866', 'Wrong Firebase project'
              pathlib.Path('android/app/google-services.json').write_bytes(raw)
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dart-turnier-android.apk
          cd dist
          sha256sum dart-turnier-android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/*
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.jks"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            architecture: x64
          - platform: linux
            runner: ubuntu-22.04
            architecture: x64
          - platform: linux
            runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.architecture == 'x64'
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsecret-1-dev libstdc++-12-dev curl git unzip xz-utils ffmpeg v4l-utils tesseract-ocr tesseract-ocr-eng espeak-ng libnotify-bin python3 xdg-utils
      - name: Bootstrap pinned Flutter on ARM64
        if: matrix.architecture == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          git clone --depth 1 --branch 3.41.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-arm64"
          echo "$RUNNER_TEMP/flutter-arm64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-arm64/bin/flutter" config --enable-linux-desktop
          "$RUNNER_TEMP/flutter-arm64/bin/flutter" precache --linux
      - run: flutter pub get --enforce-lockfile
      - name: Verify SQLite asset for desktop
        run: python tool/prepare_sqlite_ci.py ${{ matrix.architecture }}.${{ matrix.platform }}
      - name: Verify update logic on Linux architectures
        if: matrix.platform == 'linux'
        run: flutter test test/android_release_test.dart test/desktop_update_test.dart test/linux_platform_test.dart
      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release
      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $version = ([regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$'))
          if (!$version.Success) { throw 'Invalid desktop version' }
          @{schemaVersion=1; version=$version.Groups[1].Value; build=[int]$version.Groups[2].Value; platform='windows'; architecture='x64'} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM build/windows/x64/runner/Release/data/update-manifest.json
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/dart-turnier-windows-x64.zip
      - name: Package Linux bundle
        if: matrix.platform == 'linux'
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, os, pathlib, re
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)
          assert match, 'Invalid desktop version'
          arch = os.environ['PACKAGE_ARCH']
          bundle = pathlib.Path(f'build/linux/{arch}/release/bundle')
          expected_machine = {'x64': 62, 'arm64': 183}[arch]
          for binary in [bundle / 'dart_tournament_manager', *bundle.glob('lib/**/*.so*')]:
              with binary.open('rb') as stream:
                  header = stream.read(20)
              assert header[:6] == b'\x7fELF\x02\x01', f'Not a little-endian ELF64 binary: {binary}'
              assert int.from_bytes(header[18:20], 'little') == expected_machine, f'Wrong architecture: {binary}'
          (bundle / 'data/update-manifest.json').write_text(json.dumps(dict(schemaVersion=1, version=match[1], build=int(match[2]), platform='linux', architecture=arch)))
          import shutil
          shutil.copyfile('linux/install-desktop.py', bundle / 'install-desktop.py')
          PY
          tar --dereference -czf "dist/dart-turnier-linux-$PACKAGE_ARCH.tar.gz" -C "build/linux/$PACKAGE_ARCH/release/bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Create checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum dart-turnier-* > SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Android: signierte APK.
          Windows x64: ZIP vollständig entpacken und dart_tournament_manager.exe starten. Nicht Authenticode-signiert.
          Linux x64: vollständiges Archiv entpacken, dart_tournament_manager starten. Benötigt GTK 3 und eine mit Ubuntu 22.04 kompatible Laufzeit.
          Linux ARM64: eigenes Paket für 64-Bit-ARM-Systeme, einschließlich Raspberry Pi mit kompatiblem 64-Bit-Desktop-Linux. Benötigt GTK 3 und GStreamer; kein 32-Bit-Paket.

          Vor einem Wechsel eine Datensicherung exportieren. In-App-Updates unterstützen Android, Windows x64 und Linux x64/ARM64; Installation und Neustart werden in der App bestätigt.
          EOF
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Dart Turnier $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

