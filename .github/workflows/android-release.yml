name: App Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APPDATA: /tmp/dart-tournament-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate release version
        shell: python
        run: |
          import os, pathlib, re
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+\+[1-9]\d*)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)[1]
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pubspec.yaml including build number'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_TAG=v' + version + '\n')
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/tournament_simulation_matrix_test.dart test/android_release_test.dart test/backup_service_test.dart
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: python
        run: |
          import base64, os, pathlib
          for key in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']:
              if not os.environ.get(key):
                  raise SystemExit('Missing Android signing secret: ' + key)
          keyfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': str(keyfile), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          pathlib.Path('android/key.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()))
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dart-turnier-android.apk
          cd dist
          sha256sum dart-turnier-android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/*
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.jks"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
          - platform: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release
      - name: Package Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/dart-turnier-windows-x64.zip
      - name: Package Linux bundle
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf dist/dart-turnier-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Package macOS app (not notarized)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/dart_tournament_manager.app dist/dart-turnier-macos-unnotarized.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  ios-check:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned build for developers only
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/ios-unsigned-build-check.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build-check-NOT-INSTALLABLE
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Create checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum dart-turnier-* > SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Android: signierte APK.
          Windows x64: ZIP vollständig entpacken und dart_tournament_manager.exe starten. Nicht Authenticode-signiert.
          Linux x64: vollständiges Archiv entpacken, dart_tournament_manager starten. Benötigt GTK 3 und eine mit Ubuntu 22.04 kompatible Laufzeit.
          macOS: App-ZIP, noch ohne Developer-ID-Signierung und Apple-Notarisierung. Gatekeeper kann den Start blockieren.
          iOS: noch kein installierbarer Download; Apple-Signierung und Vertriebsweg fehlen. Der separate Actions-Build ist nur ein unsignierter Build-Check.

          Vor einem Wechsel eine Datensicherung exportieren. Automatische In-App-Updates stehen derzeit nur für Android zur Verfügung.
          EOF
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Dart Turnier $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
