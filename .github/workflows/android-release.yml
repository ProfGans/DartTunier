name: Android Release

on:
  push:
    tags: ['v*.*.*+*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APPDATA: /tmp/dart-tournament-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate release version
        shell: python
        run: |
          import os, pathlib, re
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+\+[1-9]\d*)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)[1]
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pubspec.yaml including build number'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_TAG=v' + version + '\n')
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/tournament_simulation_matrix_test.dart test/android_release_test.dart test/backup_service_test.dart
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: python
        run: |
          import base64, os, pathlib
          for key in ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']:
              if not os.environ.get(key):
                  raise SystemExit('Missing Android signing secret: ' + key)
          keyfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': str(keyfile), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          pathlib.Path('android/key.properties').write_text('\n'.join(k + '=' + escape(v) for k, v in values.items()))
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/dart-turnier-android.apk
          cd dist
          sha256sum dart-turnier-android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/*
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Android $RELEASE_TAG" --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.jks"
